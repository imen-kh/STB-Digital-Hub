<app-card cardTitle="Basic Table" cardClass="table-card" blockClass="pb-0">
  <app-scrollbar [customStyle]="'calc(100vh - 360px)'">
    <div class="table-responsive">
      <table class="table mb-0">
        <thead>
          <tr>
            <th scope="col">id</th>
            <th scope="col">Country</th>
            <th scope="col">Area</th>
            <th scope="col">Population</th>
          </tr>
        </thead>
        <tbody>
          @for (country of countries; track country.name; let i = $index) {
            <tr>
              <th scope="row">{{ i + 1 }}</th>
              <td>
                <img
                  [src]="'https://upload.wikimedia.org/wikipedia/commons/' + country.flag"
                  [alt]="'The flag of ' + country.name"
                  class="me-2"
                  style="width: 20px"
                />
                {{ country.name }}
              </td>
              <td>{{ country.area | number }}</td>
              <td>{{ country.population | number }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </app-scrollbar>
</app-card>
