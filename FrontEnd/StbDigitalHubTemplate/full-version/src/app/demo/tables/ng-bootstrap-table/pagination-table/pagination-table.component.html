<app-card cardTitle="Pagination Table" cardClass="table-card" blockClass="table-responsive" footerClass="p-t-0 border-0">
  <div class="table-responsive dt-responsive">
    <table class="table">
      <thead>
        <tr>
          <th scope="col">#</th>
          <th scope="col">Country</th>
          <th scope="col">Area</th>
          <th scope="col">Population</th>
        </tr>
      </thead>
      <tbody>
        @for (country of countries; track country.name) {
          <tr>
            <th scope="row">{{ country.id }}</th>
            <td class="text-truncate">
              <img
                [src]="'https://upload.wikimedia.org/wikipedia/commons/' + country.flag"
                [alt]="'The flag of ' + country.name"
                class="me-2"
                style="width: 20px"
              />
              {{ country.name }}
            </td>
            <td>{{ country.area | number }}</td>
            <td>{{ country.population | number }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
  <div class="d-sm-flex align-item-center justify-content-between py-2 px-3">
    <select class="form-select" style="width: auto" [(ngModel)]="pageSize" (ngModelChange)="refreshCountries()">
      <option [ngValue]="2">2 items per page</option>
      <option [ngValue]="5">5 items per page</option>
      <option [ngValue]="8">8 items per page</option>
    </select>
    <ngb-pagination
      [collectionSize]="collectionSize"
      [(page)]="page"
      [pageSize]="pageSize"
      (pageChange)="refreshCountries()"
      class="ms-3"
    />
  </div>
</app-card>
