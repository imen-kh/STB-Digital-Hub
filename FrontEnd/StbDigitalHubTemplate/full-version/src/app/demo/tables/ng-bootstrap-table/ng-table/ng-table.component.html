<div class="row">
  <div class="col-sm-12">
    <app-card cardTitle="All Future Table" cardClass="table-card" footerClass="p-t-0 border-0">
      <form class="table-responsive">
        <div class="m-3 row">
          <label for="table-complete-search" class="col-xs-3 col-sm-auto col-form-label">Full text search:</label>
          <div class="col-xs-3 col-sm-auto">
            <input id="table-complete-search" type="text" class="form-control" name="searchTerm" [(ngModel)]="service.searchTerm" />
          </div>
        </div>
        <table class="table table-striped">
          <thead>
            <tr>
              <th scope="col">#</th>
              <th scope="col" sortable="name">Country</th>
              <th scope="col" sortable="area">Area</th>
              <th scope="col" sortable="population">Population</th>
            </tr>
          </thead>
          <tbody>
            @for (country of countries$ | async; track country.id) {
              <tr>
                <th scope="row">{{ country.id }}</th>
                <td class="text-truncate">
                  <img
                    [src]="'https://upload.wikimedia.org/wikipedia/commons/' + country.flag"
                    [alt]="'The flag of ' + country.name"
                    class="me-2"
                    style="width: 20px"
                  />
                  <ngb-highlight [result]="country.name" [term]="service.searchTerm" />
                </td>
                <td><ngb-highlight [result]="country.area | number" [term]="service.searchTerm" /></td>
                <td><ngb-highlight [result]="country.population | number" [term]="service.searchTerm" /></td>
              </tr>
            } @empty {
              <tr>
                <td colspan="4" style="text-align: center">No countries found</td>
              </tr>
            }
          </tbody>
        </table>
        <ng-template #footerTemplate>
          <div class="d-sm-flex align-items-center justify-content-between">
            <ngb-pagination [collectionSize]="(total$ | async)!" [(page)]="service.page" [pageSize]="service.pageSize" />
            <select class="form-select" style="width: auto" name="pageSize" [(ngModel)]="service.pageSize">
              <option [ngValue]="2">2 items per page</option>
              <option [ngValue]="4">4 items per page</option>
              <option [ngValue]="6">6 items per page</option>
            </select>
          </div>
        </ng-template>
      </form>
    </app-card>
  </div>
</div>
