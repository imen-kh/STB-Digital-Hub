<div class="row">
  <!-- [ sample-page ] start -->
  <div class="col-sm-12">
    <div class="card table-card">
      <div class="card-header d-sm-flex align-items-center justify-content-between">
        <h5 class="mb-3 mb-sm-0">Student List</h5>
        <div class="d-flex align-items-center justify-content-between gap-2 flex-wrap">
          <a [routerLink]="['/online-course/student/apply']" class="btn btn-outline-secondary me-2">Apply Student List</a>
          <a [routerLink]="['/online-course/student/add']" class="btn btn-primary d-inline-flex align-items-center">
            <i class="ti ti-plus me-2"></i>
            <span>Add Student</span>
          </a>
        </div>
      </div>
      <div class="card-body p-3">
        <form class="dt-responsive">
          <div class="d-sm-flex align-items-center justify-content-between p-3">
            <div class="dataTable-dropdown mb-2">
              <select class="form-select" title="select item per page" style="width: auto" name="pageSize" [(ngModel)]="service.pageSize">
                <option [ngValue]="5">5 items per page</option>
                <option [ngValue]="10">10 items per page</option>
                <option [ngValue]="15">15 items per page</option>
              </select>
            </div>
            <div class="dataTable-search d-flex align-items-center mb-2">
              <input
                id="table-complete-search"
                type="text"
                class="form-control"
                name="searchTerm"
                [(ngModel)]="service.searchTerm"
                placeholder="Search..."
              />
            </div>
          </div>
          <div class="table-responsive dt-responsive">
            <table class="table table-hover mb-0">
              <thead>
                <tr>
                  <th scope="col">NAME</th>
                  <th scope="col">DEPARTMENT</th>
                  <th scope="col">QUALIFICATION</th>
                  <th scope="col">MOBILE</th>
                  <th scope="col">JOINING DATE</th>
                  <th scope="col" class="text-center">ACTIONS</th>
                </tr>
              </thead>
              <tbody>
                @for (student of students$ | async; track student.id) {
                  <tr>
                    <td>
                      <div class="d-flex align-items-center">
                        <div class="flex-shrink-0">
                          <img src="{{ student.src }}" alt="user image" class="img-radius wid-40" />
                        </div>
                        <div class="flex-grow-1 ms-3">
                          <h6 class="mb-0">{{ student.name }}</h6>
                        </div>
                      </div>
                    </td>
                    <td><ngb-highlight [result]="student.departments" [term]="service.searchTerm" /></td>
                    <td><ngb-highlight [result]="student.qualification" [term]="service.searchTerm" /></td>
                    <td><ngb-highlight [result]="student.mobile" [term]="service.searchTerm" /></td>
                    <td><ngb-highlight [result]="student.date" [term]="service.searchTerm" /></td>
                    <td class="text-center" style="min-width: 150px">
                      <ul class="list-inline me-auto mb-0">
                        <li class="list-inline-item align-bottom">
                          <a href="javascript:void(0)" class="avatar avatar-xs btn-link-secondary" ngbTooltip="View">
                            <i class="ti ti-eye f-20"></i>
                          </a>
                        </li>
                        <li class="list-inline-item align-bottom">
                          <a href="javascript:void(0)" class="avatar avatar-xs btn-link-primary" ngbTooltip="Edit">
                            <i class="ti ti-edit f-20"></i>
                          </a>
                        </li>
                        <li class="list-inline-item align-bottom">
                          <a href="javascript:void(0)" ngbTooltip="Delete" class="avatar avatar-xs btn-link-danger">
                            <i class="ti ti-trash f-20 d-flex"></i>
                          </a>
                        </li>
                      </ul>
                    </td>
                  </tr>
                }
              </tbody>
            </table>
          </div>
          <div class="d-sm-flex justify-content-between align-items-center p-3">
            <div class="datatable-info mb-2">Showing 1 to {{ service.pageSize }} of 15 entries</div>
            <ngb-pagination
              [collectionSize]="(total$ | async)!"
              [(page)]="service.page"
              [pageSize]="service.pageSize"
              class="table-pagination mb-2"
            />
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
