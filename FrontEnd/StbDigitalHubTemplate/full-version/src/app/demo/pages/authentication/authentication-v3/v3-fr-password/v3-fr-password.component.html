<div class="auth-main">
  <div class="auth-wrapper v3">
    <div class="auth-form">
      <div class="card auth-card mt-5">
        <div class="card-body">
          <form (ngSubmit)="onSubmit($event)">
            <a [routerLink]="['/']" class="d-flex justify-content-center">
              <app-logo />
            </a>
            <div class="row">
              <div class="d-flex justify-content-center">
                <div class="auth-header text-center">
                  <h2 class="text-secondary mt-5"><b>Forgot password?</b></h2>
                  <p class="f-16 mt-3">Enter your email address below and we'll send you password reset OTP.</p>
                </div>
              </div>
            </div>
            <div class="form-floating mb-3">
              <input
                type="email"
                class="form-control"
                id="floatingInput"
                [class.is-invalid]="submitted() && forgotForm.email().invalid()"
                placeholder="Email Address"
                [formField]="forgotForm.email"
              />
              <label for="floatingInput">Email address / Username</label>
              @if (submitted() && forgotForm.email().invalid()) {
                <div class="invalid-feedback">
                  @for (error of forgotForm.email().errors(); track error.kind) {
                    <div>{{ error.message }}</div>
                  }
                </div>
              }
            </div>
            <div class="d-grid mt-4">
              <button type="submit" class="btn btn-secondary p-2">Send Mail</button>
            </div>
          </form>
          <hr />
          <h5 class="d-flex justify-content-center">
            <a [routerLink]="['/auth/auth3/login']">Already have an account?</a>
          </h5>
        </div>
      </div>
    </div>
  </div>
</div>
