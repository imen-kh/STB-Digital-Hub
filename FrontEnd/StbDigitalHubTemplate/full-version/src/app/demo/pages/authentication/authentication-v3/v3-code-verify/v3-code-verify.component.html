<div class="auth-main">
  <div class="auth-wrapper v3">
    <div class="auth-form">
      <div class="card auth-card mt-5">
        <div class="card-body">
          <a [routerLink]="['/']" class="d-flex justify-content-center">
            <app-logo />
          </a>
          <div class="row">
            <div class="d-flex justify-content-center">
              <div class="text-center">
                <h2 class="text-secondary mt-5">
                  <b>Enter Verification Code</b>
                </h2>
                <h4 class="mt-3">We send you on mail.</h4>
              </div>
            </div>
          </div>
          <div class="d-flex justify-content-center">
            <p class="f-14 mt-2">We’ve sent you a code on john.****&#64;company.com</p>
          </div>
          <div class="d-flex justify-content-between">
            @for (task of tasks; track task; let i = $index) {
              <div class="d-flex align-items-center">
                <input
                  [attr.aria-label]="task.mas"
                  type="text"
                  inputmode="numeric"
                  pattern="[0-9]*"
                  title="Enter One Time Password"
                  maxlength="1"
                  class="form-control text-center w-100"
                  style="width: 60px; margin: 8px; padding: 10px; border: 1px solid rgb(224, 224, 224); border-radius: 8px"
                />
              </div>
            }
          </div>
          <div class="d-grid mt-4">
            <button type="button" class="btn btn-primary p-2">Continue</button>
          </div>
          <div class="d-flex mt-1 justify-content-between mt-4">
            <p class="text-muted">Did not receive the email? Check your spam filter, or</p>
            <p class="text-primary">Resend code</p>
          </div>
          <hr />
          <h5 class="d-flex justify-content-center">Did not receive the email? Check your spam filter, or</h5>
          <div class="d-grid mt-4">
            <button type="button" class="btn btn-outline-secondary bg-light text-secondary p-2">Resend Code</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
