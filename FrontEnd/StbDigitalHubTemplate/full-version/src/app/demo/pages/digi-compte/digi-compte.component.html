<div class="digi-compte-page">
  <div class="page-header mb-4">
    <div>
      <h4 class="mb-1">Mes comptes</h4>
    </div>
    <div class="filter-bar">
      <label class="form-label mb-0 small text-muted">Filtrer par type</label>
      <select class="form-select form-select-sm" [ngModel]="typeFilter()" (ngModelChange)="typeFilter.set($event); onFilterChange()">
        <option value="">Tous</option>
        <option value="Courant">Courant</option>
        <option value="Epargne">Épargne</option>
      </select>
    </div>
  </div>

  @if (error()) {
    <div class="alert alert-danger">{{ error() }}</div>
  }

  @if (loading()) {
    <div class="text-center py-5">
      <span class="spinner-border text-primary"></span>
      <p class="mt-2 mb-0 text-muted">Chargement de vos comptes...</p>
    </div>
  } @else {
    <div class="accounts-grid">
      @for (account of accounts(); track account.id) {
        <app-account-widget [account]="account" (accountClick)="openAccount($event)" />
      } @empty {
        <div class="alert alert-info">Aucun compte trouvé pour ce filtre.</div>
      }
    </div>
  }
</div>
