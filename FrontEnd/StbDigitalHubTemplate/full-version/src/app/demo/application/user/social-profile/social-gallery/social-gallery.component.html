<div class="row">
  <div class="col-sm-12">
    <div class="card">
      <div class="card-header">
        <div class="row align-items-center g-2">
          <div class="col">
            <h5>Gallery</h5>
          </div>
          <div class="col-auto">
            <button class="btn btn-secondary">Add Photos</button>
          </div>
        </div>
      </div>
      <div class="card-body">
        <div class="row">
          @for (images of imageList; track images) {
            <div class="col-lg-3 col-md-4 col-sm-6">
              @if (images.src) {
                <div class="card gallery-card">
                  <img src="{{ images.src }}" alt="images" class="img-card-top img-fluid" />
                  <div class="card-body p-3">
                    <div class="d-flex align-items-center mb-3">
                      <div class="flex-grow-1 me-2">
                        <h5 class="mb-1 text-truncate">1080p_table_denar.pdf</h5>
                        <h6 class="text-truncate text-muted d-flex align-items-center mb-0">
                          <i class="material-icons-two-tone f-14 me-1">event</i>
                          Tue Aug 24 2021
                        </h6>
                      </div>
                      <div ngbDropdown>
                        <a class="avatar avatar-xs bg-light-secondary text-secondary arrow-none" type="button" ngbDropdownToggle>
                          <i class="ti ti-dots f-16"></i>
                        </a>
                        <div class="dropdown-menu-end" ngbDropdownMenu>
                          <a href="javascript:void(0)" ngbDropdownItem>Remove Tag</a>
                          <a href="javascript:void(0)" ngbDropdownItem>Download</a>
                          <a href="javascript:void(0)" ngbDropdownItem>Make Profile Picture</a>
                          <a href="javascript:void(0)" ngbDropdownItem>Make Cover Photo</a>
                          <a href="javascript:void(0)" ngbDropdownItem>Find Support or Report Photo</a>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              } @else {
                <div style="min-height: 272px; display: flex; align-items: center; justify-content: center">
                  <app-placeholder-card-1 height="272" />
                </div>
              }
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</div>
