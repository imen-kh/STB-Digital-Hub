<div class="row user-profile-card">
  <div class="col-sm-12">
    <div class="card">
      <div class="card-header">
        <div class="row align-items-center g-2">
          <div class="col">
            <h5>Cards</h5>
          </div>
          <div class="col-auto">
            <div class="form-search">
              <i class="ti ti-search"></i>
              <input type="text" class="form-control" [(ngModel)]="searchTerm" placeholder="Search" (input)="filterFriends(searchTerm)" />
            </div>
          </div>
        </div>
      </div>
      <div class="card-body">
        <div class="row">
          @for (task of cardList; track task) {
            <div class="col-xxl-3 col-lg-4 col-md-6">
              @if (task.src) {
                <div class="card follower-card card-style-1">
                  <div class="card-body p-3">
                    <div class="d-flex align-items-start mb-4">
                      <div class="flex-grow-1 me-2">
                        <img class="img-radius img-fluid" src="{{ task.src }}" alt="card images" />
                      </div>
                      <div ngbDropdown>
                        <a class="text-primary opacity-50 arrow-none text-muted" type="button" ngbDropdownToggle>
                          <i class="ti ti-dots f-16"></i>
                        </a>
                        <div class="dropdown-menu-end" ngbDropdownMenu>
                          <a href="javascript:void(0)" ngbDropdownItem>
                            <i class="material-icons-two-tone">favorite</i>
                            Favorites
                          </a>
                          <a href="javascript:void(0)" ngbDropdownItem>
                            <i class="material-icons-two-tone">group</i>
                            Edit Friend List
                          </a>
                          <a href="javascript:void(0)" ngbDropdownItem>
                            <i class="material-icons-two-tone">delete</i>
                            Removed
                          </a>
                        </div>
                      </div>
                    </div>
                    <h3 class="mb-0 text-truncate f-w-600">{{ task.name }}</h3>
                    <div class="text-truncate text-muted d-flex align-items-center text-sm">{{ task.position }}</div>
                    <p class="my-4 text-gray-700 text-sm">{{ task.text }}</p>
                    <div class="row">
                      <div class="col-12 mb-4">
                        <p class="mb-0 text-muted text-sm">Email</p>
                        <h6 class="mb-0">{{ task.email }}</h6>
                      </div>
                      <div class="col-sm-6 mb-4">
                        <p class="mb-0 text-muted text-sm">Phone</p>
                        <h6 class="mb-0">{{ task.phone }}</h6>
                      </div>
                      <div class="col-sm-6 mb-4">
                        <p class="mb-0 text-muted text-sm">Location</p>
                        <h6 class="mb-0">{{ task.location }}</h6>
                      </div>
                      <div class="col-sm-6">
                        <div class="d-grid mt-2">
                          <button
                            class="btn btn-outline-primary d-flex justify-content-center"
                            [ngClass]="boxLayout === true ? 'custom-btn' : ''"
                          >
                            <i class="ti ti-message me-2"></i>
                            Message
                          </button>
                        </div>
                      </div>
                      <div class="col-sm-6">
                        <div class="d-grid mt-2">
                          <button
                            class="btn btn-outline-danger d-flex justify-content-center"
                            [ngClass]="boxLayout === true ? 'custom-btn' : ''"
                          >
                            <i class="ti ti-ban me-2"></i>
                            Block
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              } @else {
                <app-placeholder-card-1 height="426" />
              }
            </div>
          }
        </div>
      </div>
    </div>
  </div>
  <!-- [ sample-page ] end -->
</div>
