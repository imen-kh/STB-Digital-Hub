<div class="dash-section mb-4">
  <div class="dash-section__head">
    <div>
      <h5 class="dash-section__title">Mes comptes</h5>
      <p class="dash-section__hint">Soldes et accès rapide</p>
    </div>
    <a routerLink="/comptes" class="btn btn-sm dash-section__btn">
      Tout voir <i class="ti ti-arrow-right ms-1"></i>
    </a>
  </div>

  @if (loading()) {
    <div class="text-center py-4">
      <span class="spinner-border spinner-border-sm text-primary"></span>
    </div>
  } @else {
    <div class="accounts-row">
      @for (account of accounts(); track account.id) {
        <app-account-widget [account]="account" (accountClick)="openAccount($event)" />
      }
    </div>
  }
</div>
