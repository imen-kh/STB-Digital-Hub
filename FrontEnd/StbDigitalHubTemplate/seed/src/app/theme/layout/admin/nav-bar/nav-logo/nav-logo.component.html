<div class="m-header">
  <a [routerLink]="['/sample-page']" class="b-brand">
    <!-- ========   change your logo hear   ============ -->
    <app-logo [isIconOnly]="currentLayout() === 'compact' && windowWidth() < 1025" />
  </a>
  <!-- ======= Menu collapse Icon ===== -->
  @if (currentLayout() !== 'horizontal') {
    <div class="pc-h-item">
      <a
        href="javascript:void(0)"
        class="pc-head-link head-link-secondary m-0 mobile-menu"
        [ngClass]="{ on: navCollapsed() }"
        id="sidebar-hide mobile-collapse"
        (click)="navCollapse()"
        title="Click to Menu Collapse"
      >
        <i class="ti ti-menu-2"></i>
      </a>
    </div>
  }
</div>
